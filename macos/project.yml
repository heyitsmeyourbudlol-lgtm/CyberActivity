# XcodeGen spec — optional; the committed .xcodeproj is enough to open/build.
# Regenerate: xcodegen generate
name: CyberActivity
options:
  bundleIdPrefix: studio.cyberactivity
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: CyberActivity
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc / local signing so the project builds on any Mac without a paid team
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  CyberActivity:
    type: application
    platform: macOS
    sources:
      - path: CyberActivity
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Fonts/**"
      - path: CyberActivity/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.cyberactivity.app
        INFOPLIST_FILE: CyberActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: CyberActivity/CyberActivity.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
      run:
        config: Debug
      archive:
        config: Release
schemes:
  CyberActivity:
    build:
      targets:
        CyberActivity: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
